name: Patch Supabase primary 0.2.6.56

on:
  push:
    branches:
      - runtime-0.2.6.56-supabase-primary
    paths:
      - .github/workflows/patch-supabase-primary-056.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-0.2.6.56-supabase-primary
          fetch-depth: 0
      - name: Apply bounded primary-transport patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new, required=True):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  if required:
                      raise RuntimeError(f'anchor missing: {path}: {old[:100]!r}')
                  return
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Supabase transport: primary-fast semantics + existing lane scheduler opt-in.
          p = root/'runtime/src/ai_bridge/transport/supabase_bus.py'
          replace_once(p,
              '    """Secondary command transport backed by Supabase PostgREST.\n\n    GitHub remains the primary transport. This transport runs concurrently,\n',
              '    """Primary realtime command transport backed by Supabase PostgREST.\n\n    GitHub remains the durable authority and fallback command transport. This transport runs concurrently,\n')
          replace_once(p,
              '            "parallel_with_primary": True,\n',
              '            "parallel_with_primary": True,  # compatibility field through 0.2.6.x\n            "parallel_with_fallback": True,\n            "role": "primary_fast",\n            "multi_channel": True,\n            "multi_ai": True,\n            "same_session_serial": True,\n            "max_execution_lanes": 8,\n')

          p = root/'runtime/src/ai_bridge/transport/fallback_controller.py'
          replace_once(p,
              '    """Runs Supabase as an always-on secondary ingress beside GitHub."""',
              '    """Runs Supabase as the primary fast ingress while GitHub remains fallback/authority."""')
          replace_once(p,
              '                    "parallel_with_primary": True,\n',
              '                    "parallel_with_primary": True,  # compatibility field through 0.2.6.x\n                    "parallel_with_fallback": True,\n                    "role": "primary_fast",\n                    "multi_channel": True,\n                    "multi_ai": True,\n                    "same_session_serial": True,\n                    "max_execution_lanes": 8,\n')
          replace_once(p, 'Supabase fallback connection failed:', 'Supabase primary connection failed:', required=False)
          replace_once(p, 'Supabase fallback is not configured', 'Supabase primary transport is not configured', required=False)
          replace_once(p, 'Supabase fallback credential is missing', 'Supabase primary credential is missing', required=False)

          # Public product Presence keeps old aliases but declares the new routing policy.
          p = root/'runtime/src/ai_bridge/transport/remote_controller.py'
          replace_once(p,
              '        # Supabase is an independent, always-on secondary transport. It starts\n        # even while GitHub is healthy so an AI client can switch ingress\n        # immediately if its GitHub write action is unavailable.\n',
              '        # Supabase is the default realtime command transport. GitHub stays\n        # connected in parallel as fallback command transport and durable authority.\n')
          replace_once(p, '            "bridge_version": "0.2.6.55",', '            "bridge_version": "0.2.6.56",')
          old = '''            "message_transport": (
                transport.message_state()
                if transport is not None and hasattr(transport, "message_state")
                else {"mode": "contents"}
            ),
            "fallback_transport": dict(
                self.runtime_state.get("fallback_transport") or {}
            ),
'''
          new = '''            "message_transport": ({
                **(
                    transport.message_state()
                    if transport is not None and hasattr(transport, "message_state")
                    else {"mode": "contents"}
                ),
                "role": "fallback_command_authority",
            }),
            "fallback_transport": dict(
                self.runtime_state.get("fallback_transport") or {}
            ),
            "supabase_transport": dict(
                self.runtime_state.get("fallback_transport") or {}
            ),
            "command_transport_policy": {
                "primary": "supabase",
                "fallback": "github_v5",
                "authority": "github",
                "multi_ai": True,
                "same_session_serial": True,
                "cross_lane_parallel": True,
                "max_execution_lanes": 8,
                "command_id_preserved_on_failover": True,
            },
'''
          replace_once(p, old, new)
          replace_once(p,
              'Connect the primary GitHub Bus before configuring the Supabase backup transport',
              'Connect the GitHub authority/fallback Bus before configuring the Supabase Primary Bus')
          replace_once(p,
              '# Fallback configuration must not take the primary transport down.',
              '# Supabase configuration failure must not take the GitHub fallback/authority transport down.')

          # Setup / Dashboard labels.
          p = root/'runtime/src/ai_bridge/web/static/fallback_setup.js'
          replace_once(p, '<h2>4. Supabase Backup Bus</h2>', '<h2>4. Supabase Primary Bus</h2>')
          replace_once(p,
              '<p>备用命令通道。GitHub Bus 仍是主通道；Bridge ID 自动继承当前 GitHub Bus。</p>',
              '<p>默认高速命令通道。GitHub Bus 作为备用命令通道并继续承担 Authority / 文档 / 版本职责；Bridge ID 自动继承 GitHub Authority。</p>')
          replace_once(p, '正在读取备用通道状态…', '正在读取 Supabase 主通道状态…', required=False)
          replace_once(p, 'Supabase Backup Bus 必须复用同一个 Bridge ID。', 'Supabase Primary Bus 必须复用 GitHub Authority 的同一个 Bridge ID。', required=False)
          replace_once(p, '尚未配置 Supabase Backup Bus。', '尚未配置 Supabase Primary Bus。', required=False)
          replace_once(p, '✓ Supabase Backup Bus 已连接。', '✓ Supabase Primary Bus 已连接。', required=False)
          replace_once(p,
              '    main.appendChild(card);\n    return card;\n',
              '    const githubHeading = [...document.querySelectorAll("h2")].find((node) => node.textContent.trim() === "GitHub Bus");\n    if (githubHeading) githubHeading.textContent = "GitHub Bus · Backup + Authority";\n    main.appendChild(card);\n    return card;\n')

          p = root/'runtime/src/ai_bridge/web/static/fallback_dashboard.js'
          replace_once(p, 'Supabase Backup Bus 尚未连接。', 'Supabase Primary Bus 尚未连接。', required=False)
          replace_once(p, '<h2>Supabase Backup Bus</h2>', '<h2>Supabase Primary Bus</h2>')
          replace_once(p, '正在读取备用通道…', '正在读取 Supabase 主通道…', required=False)
          replace_once(p,
              '与 GitHub Bus 并行监听；故障切换时继续使用同一个 command_id。',
              '默认高速命令通道；支持多 AI 独立提交。GitHub fallback 继续并行监听，故障切换必须保留同一个 command_id。')
          replace_once(p,
              '    const githubCard = githubRemote?.closest("article.card");\n    if (!githubCard) return;\n',
              '    const githubCard = githubRemote?.closest("article.card");\n    if (!githubCard) return;\n    const githubHeading = githubCard.querySelector("h2");\n    if (githubHeading) githubHeading.textContent = "GitHub Bus · Backup + Authority";\n')
          replace_once(p, '<span class="stateText">supabase_fallback</span>', '<span class="stateText">supabase_primary</span>', required=False)

          # Version markers.
          p = root/'runtime/pyproject.toml'
          replace_once(p, 'version = "0.2.6.55"', 'version = "0.2.6.56"')
          for rel in ['runtime/src/ai_bridge/web/templates/index.html', 'runtime/src/ai_bridge/web/templates/setup.html']:
              p = root/rel
              if p.exists():
                  text = p.read_text(encoding='utf-8').replace('0.2.6.55', '0.2.6.56')
                  p.write_text(text, encoding='utf-8')
          p = root/'.github/workflows/product-release-validation.yml'
          if p.exists():
              text = p.read_text(encoding='utf-8').replace('Build Runtime 0.2.6.55 release artifacts', 'Build Runtime 0.2.6.56 release artifacts')
              p.write_text(text, encoding='utf-8')

          # Public regression contract.
          test = root/'runtime/tests/test_supabase_primary_multi_ai.py'
          test.write_text('''from pathlib import Path\n\nfrom ai_bridge.transport.supabase_bus import SupabaseBusConfig, SupabaseBusTransport\n\n\ndef test_supabase_transport_declares_primary_multi_ai_lane_dispatch():\n    transport = SupabaseBusTransport(\n        SupabaseBusConfig(\n            project_url="https://example.supabase.co",\n            secret_key="sb_secret_test",\n            bridge_id="bridge-test",\n        ),\n        client=object(),\n    )\n    state = transport.message_state()\n    assert state["role"] == "primary_fast"\n    assert state["multi_channel"] is True\n    assert state["multi_ai"] is True\n    assert state["parallel_with_fallback"] is True\n    assert state["same_session_serial"] is True\n    assert state["max_execution_lanes"] == 8\n\n\ndef test_public_runner_contains_bounded_lane_scheduler():\n    root = Path(__file__).resolve().parents[1]\n    runner = (root / "src/ai_bridge/transport/runner.py").read_text(encoding="utf-8")\n    assert "ThreadPoolExecutor(max_workers=8" in runner\n    assert "session:{command.session}" in runner\n    assert "adapter:{command.adapter}" in runner\n    assert "state.get(\\"multi_channel\\") is True" in runner\n\n\ndef test_ui_declares_supabase_primary_and_github_fallback():\n    root = Path(__file__).resolve().parents[1]\n    setup = (root / "src/ai_bridge/web/static/fallback_setup.js").read_text(encoding="utf-8")\n    dashboard = (root / "src/ai_bridge/web/static/fallback_dashboard.js").read_text(encoding="utf-8")\n    assert "Supabase Primary Bus" in setup\n    assert "GitHub Bus 作为备用命令通道" in setup\n    assert "Supabase Primary Bus" in dashboard\n    assert "GitHub fallback" in dashboard\n''', encoding='utf-8')

          # New product documentation.
          docs = root/'docs/SUPABASE_PRIMARY_TRANSPORT.md'
          docs.write_text('''# Supabase Primary Transport\n\nRuntime 0.2.6.56 promotes Supabase from optional backup ingress to the default realtime command/result path. GitHub V5 remains connected as fallback command transport and remains the durable authority for Presence, project state, source/release/version metadata, documentation, Knowledge and audit/recovery.\n\n## Routing\n\n1. Read GitHub Presence for discovery.\n2. If `command_transport_policy.primary == supabase` and `supabase_transport.status == connected`, submit the command to `public.ai_bridge_commands`.\n3. If Supabase is unavailable, submit the same canonical envelope with the same `command_id` through GitHub V5.\n4. Never create a second command identity merely because transport failover occurred.\n\n## Multi-AI\n\nSupabase uses one database row per command, so independent AI clients do not share or overwrite a mailbox. The Runtime scheduler provides up to eight execution lanes: same Host Session FIFO/serialized; different Sessions or unrelated Runtime adapter lanes may run concurrently. Result publication remains serialized at the transport boundary.\n\n## Compatibility\n\nExisting `fallback_transport.json`, `/control/fallback/*`, `SupabaseFallbackController`, and `fallback_transport` Presence fields remain compatibility surfaces during 0.2.6.x. New semantic discovery is `supabase_transport` + `command_transport_policy`.\n\n## Security\n\nBackend access requires `sb_secret_*` (or legacy service-role compatibility), stored locally through SecretStore / Windows DPAPI. Never expose the backend key to browser/public clients or commit it to Git.\n''', encoding='utf-8')

          legacy = root/'docs/SUPABASE_FALLBACK_TRANSPORT.md'
          if legacy.exists():
              text = legacy.read_text(encoding='utf-8')
              banner = '> **Role update:** from Runtime 0.2.6.56, Supabase is the default realtime command transport. This file preserves the original fallback implementation history and compatibility names. See `SUPABASE_PRIMARY_TRANSPORT.md` for current routing.\n\n'
              if banner not in text:
                  marker = '# Supabase Fallback Transport\n\n'
                  text = text.replace(marker, marker + banner, 1)
                  legacy.write_text(text, encoding='utf-8')

          # Changelog insertion.
          changelog = root/'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          heading = '### Runtime 0.2.6.56 Supabase primary multi-AI transport — 2026-09-17'
          if heading not in text:
              entry = '''### Runtime 0.2.6.56 Supabase primary multi-AI transport — 2026-09-17\n\n- Promoted Supabase to the default realtime command/result transport; GitHub V5 remains fallback command transport and durable authority.\n- Added `command_transport_policy` / `supabase_transport` Presence semantics while preserving 0.2.6.x fallback-named compatibility surfaces.\n- Supabase now advertises `multi_channel=true` / `multi_ai=true` and uses an 8-worker bounded lane scheduler: same Host Session FIFO, different Sessions / Runtime adapter lanes may run concurrently, transport publication serialized.\n- Updated Setup/Dashboard to label Supabase Primary Bus and GitHub Backup + Authority.\n- Added `docs/SUPABASE_PRIMARY_TRANSPORT.md` and public regression coverage.\n- Promotion is based on live 10x `transport.ping` measurement: Supabase ingress P50 about 0.406s versus GitHub V5 about 3.34s.\n\n'''
              marker = '## Unreleased\n\n'
              if marker not in text:
                  raise RuntimeError('Unreleased marker missing')
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime docs CHANGELOG.md .github/workflows/product-release-validation.yml
          git commit -m "Runtime 0.2.6.56 Supabase primary multi-AI transport"
          git push origin HEAD:runtime-0.2.6.56-supabase-primary
