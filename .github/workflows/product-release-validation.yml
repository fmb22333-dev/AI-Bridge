name: Product release validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-product-validation:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "runtime[test]"

      - name: Build deterministic product release
        shell: pwsh
        run: python installer/build_release.py

      - name: Compile product
        shell: pwsh
        run: python -m compileall -q runtime/src runtime/houdini_adapter installer

      - name: Full product tests
        shell: pwsh
        run: python -m pytest -q runtime/tests

      - name: Verify release artifacts
        shell: pwsh
        run: python installer/verify_release.py

      - name: Parse PowerShell installer
        shell: powershell
        run: |
          $text = Get-Content -Raw ".\INSTALL_AI_BRIDGE.ps1"
          [void][scriptblock]::Create($text)

      - name: Publish generated release artifacts
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime_bundle.zip AI_Bridge_Installer.zip runtime-release.json supervisor-release.json release-manifest.json knowledge/houdini
          if (git diff --cached --quiet) {
            Write-Host "Generated release artifacts are already synchronized."
          } else {
            git commit -m "Build Runtime 0.2.6.51 release artifacts"
            git push origin "HEAD:${{ github.ref_name }}"
          }

      - name: Smoke install from GitHub branch
        if: github.event_name == 'push'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "AI_Bridge_Fresh"
          & ".\INSTALL_AI_BRIDGE.ps1" -InstallDir $target -Ref "${{ github.ref_name }}" -NoLaunch
          if (-not (Test-Path (Join-Path $target "Runtime\Current\pyproject.toml"))) { throw "Installed Runtime missing" }
          if (-not (Test-Path (Join-Path $target "_System\supervisor.py"))) { throw "Installed Supervisor missing" }
          $update = Get-Content -Raw (Join-Path $HOME ".ai_bridge\update_source.json") | ConvertFrom-Json
          if ($update.repository -ne "fmb22333-dev/AI-Bridge") { throw "Wrong product update repository" }
          if ($update.branch -ne "main") { throw "Wrong product update branch" }
          if ($update.manifest_path -ne "runtime-release.json") { throw "Wrong product manifest authority" }
          if ($update.bootstrap_from_bus -ne $false) { throw "Bus bootstrap must be disabled" }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Product validation completed for ${{ github.sha }}"
