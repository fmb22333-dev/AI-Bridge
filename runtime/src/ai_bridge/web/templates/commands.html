<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Bridge · 命令历史</title>
  <link rel="stylesheet" href="/control/app.css?v=0.2.6.14">
</head>
<body>
<main class="shell historyShell">
  <header class="topbar">
    <div>
      <h1>命令历史</h1>
      <p>独立历史视图，不占用主控制台空间。</p>
    </div>
    <a class="buttonLink" href="/">返回控制台</a>
  </header>

  <article class="card">
    <div class="historyToolbar">
      <input id="historyFilter" placeholder="筛选 ID / Workspace / Adapter / Operation / Status">
      <select id="historyLimit" aria-label="历史数量">
        <option value="50">最近 50 条</option>
        <option value="100" selected>最近 100 条</option>
        <option value="200">最近 200 条</option>
      </select>
      <button id="refreshHistory">刷新</button>
      <span id="historyStats" class="historyStats">读取中…</span>
    </div>
    <div id="historyError" class="errorText"></div>
    <div class="tableWrap">
      <table class="historyTable">
        <thead>
          <tr>
            <th>时间</th><th>ID</th><th>Workspace</th><th>Adapter / Session</th>
            <th>Operation</th><th>Status</th><th>Evidence</th><th>详情</th>
          </tr>
        </thead>
        <tbody id="commandHistory"></tbody>
      </table>
    </div>
  </article>
</main>
<script src="/control/commands.js?v=0.2.6.14"></script>
</body>
</html>
